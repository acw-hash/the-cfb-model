[project]
name = "ncaa-quant"
version = "0.1.0"
description = "NCAA football prediction system"
readme = "docs/index.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2,<3",
    "polars>=1,<2",
    "duckdb>=1,<2",
    "pyarrow>=17,<20",
    "pandera>=0.20,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "omegaconf>=2,<3",
    "structlog>=24,<26",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "tenacity>=8,<10",
    "scikit-learn>=1,<2",
    "lightgbm>=4,<5",
    "xgboost>=2,<3",
    "catboost>=1,<2",
    "ngboost>=0.5,<1",
    "optuna>=3,<5",
    "mlflow>=2,<3",
    "prefect>=2,<4",
    "great-expectations>=1,<2",
    "matplotlib>=3,<4",
    "dvc>=3,<4",
    "scipy>=1,<2",
    "shap>=0.44,<1",
    "jinja2>=3,<4",
    "plotly>=5,<6",
    "boto3>=1,<2",
]

[project.optional-dependencies]
research = [
    "numpyro>=0.15,<1",
    "jax>=0.4,<1",
    "pymc-bart>=0.5,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "hypothesis>=6,<7",
    "ruff>=0.6,<1",
    "mypy>=1,<2",
    "pre-commit>=3,<5",
    "jsonschema>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# shap → numba: default resolve without an override picks older numba and can
# leave numpy at 2.2, which regresses mypy strict vs the project's 2.4 baseline.
# numba 0.64+ supports numpy 2.4. research/pymc-bart may still conflict —
# install that extra in a dedicated env if needed.
[tool.uv]
override-dependencies = [
    "numba>=0.64,<0.65",
    "numpy>=2.4,<3",
]

[project.scripts]
ncaa-quant = "ncaa_quant.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-fail-under=80"
pythonpath = ["src", "."]
markers = [
    "live: hits the network; excluded from CI and default make test",
    "workstation: needs gitignored data/ artifacts; excluded from GitHub pytest",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/evaluation/d3_eval.py",  # D3 measurement harness (docs/notes runner)
    "*/evaluation/d4_eval.py",  # D4 measurement harness (docs/notes runner)
]

[tool.coverage.report]
show_missing = true
skip_empty = true
omit = [
    "*/evaluation/d3_eval.py",
    "*/evaluation/d4_eval.py",
]