# Task 23 eight-run set for `backtest plan --config task23_run_set`.
# Per-run seasons: full walk-forward 2019–2024 (2020 continuity) except A6
# which is snapshot-regime 2021–2024 only (§7.2 / historical-odds change set).
# 2025 excluded 2026-08-07: it is the lockbox season (§7.2 item 9), and
# WalkForwardConfig.validate_ablations now refuses a config that reads it.
run_set: task23
description: >
  Eight Task 23 runs — fundamental + market-aware full systems and A1–A6.
  Plan reports per-run and total wall clock from the measured week-unit model.

runs:
  - name: fundamental_full
    stack: fundamental
    run_id: task23_fundamental
    ablation_id: full
    walkforward:
      test_seasons: [2019, 2021, 2022, 2023, 2024]
      continuity_seasons: [2020]
      retrain_weeks: [5, 10]
      market_features_available: false
      preseason_priors: fitted
      rating_updates: continual
      mapping_layer: ensemble
      garbage_time_filter: true
      market_feature_source: snapshots
      seed: 42
      model_version: production-v0
      run_id: task23_fundamental
      ablation_id: full

  - name: market_aware_full
    stack: market_aware
    run_id: task23_market_aware
    ablation_id: full
    walkforward:
      test_seasons: [2019, 2021, 2022, 2023, 2024]
      continuity_seasons: [2020]
      retrain_weeks: [5, 10]
      market_features_available: true
      preseason_priors: fitted
      rating_updates: continual
      mapping_layer: ensemble
      garbage_time_filter: true
      market_feature_source: snapshots
      seed: 42
      model_version: production-v0
      run_id: task23_market_aware
      ablation_id: full

  - name: A1_priors_off
    stack: fundamental
    run_id: task23_a1
