/**
 * Ridge design tokens — §4.1 palette, spacing, and type scale.
 * This file is the ONLY place raw color/size literals may appear.
 */

:root {
  /* §4.1 palette — light */
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f7;
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  /* W8-A: was #aeaeb2 (2.21:1 on white — fails AA). #75757a ≈ 4.58:1. */
  --text-tertiary: #75757a;
  --accent: #0071e3;
  --semantic-stale: #bf4800;
  --semantic-revised: #6e6e73;
  --semantic-positive: #1d1d1f;
  --border-subtle: #d2d2d7;

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* §4.2 type scale */
  --font-stack:
    "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
    sans-serif;

  --type-t1-size: 28px;
  --type-t1-line: 32px;
  --type-t1-weight: 600;

  --type-t2-size: 20px;
  --type-t2-line: 24px;
  --type-t2-weight: 600;

  --type-t3-size: 17px;
  --type-t3-line: 22px;
  --type-t3-weight: 600;

  --type-b1-size: 17px;
  --type-b1-line: 22px;
  --type-b1-weight: 400;

  --type-b2-size: 15px;
  --type-b2-line: 20px;
  --type-b2-weight: 400;

  --type-n1-size: 17px;
  --type-n1-line: 22px;
  --type-n1-weight: 500;

  --type-n2-size: 15px;
  --type-n2-line: 20px;
  --type-n2-weight: 400;

  --type-c1-size: 13px;
  --type-c1-line: 16px;
  --type-c1-weight: 500;

  --type-c2-size: 11px;
  --type-c2-line: 14px;
  --type-c2-weight: 400;

  --focus-ring: 0 0 0 2px var(--accent);
}

[data-theme="dark"] {
  --bg-primary: #000000;
  --bg-secondary: #1c1c1e;
  --text-primary: #f5f5f7;
  --text-secondary: #98989d;
  /* W8-A: was #636366 (3.51:1 on black — fails AA normal). #8e8e93 ≈ 6.44:1. */
  --text-tertiary: #8e8e93;
  --accent: #0a84ff;
  --semantic-stale: #ff9f0a;
  --semantic-revised: #98989d;
  --semantic-positive: #f5f5f7;
  --border-subtle: #38383a;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-primary: #000000;
    --bg-secondary: #1c1c1e;
    --text-primary: #f5f5f7;
    --text-secondary: #98989d;
    --text-tertiary: #8e8e93;
    --accent: #0a84ff;
    --semantic-stale: #ff9f0a;
    --semantic-revised: #98989d;
    --semantic-positive: #f5f5f7;
    --border-subtle: #38383a;
  }
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  width: 800px; height: 1000px;
  background: var(--bg-primary);
  font-family: "Inter", var(--font-stack);
  -webkit-font-smoothing: antialiased;
}
.chart-root, .chart-root * {
  font-variant-numeric: tabular-nums lining-nums;
  font-feature-settings: "tnum" 1, "lnum" 1;
}
