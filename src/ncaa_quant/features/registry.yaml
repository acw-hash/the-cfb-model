# Production feature registry (DESIGN §4.1 / §4.7).
#
# Each entry MUST include a non-empty `hypothesis`. Empty hypothesis is a
# registry validation error (primary defense against p-hacking).
#
# Fields:
#   name            — stable feature id (snake_case)
#   version         — string; bump when definition changes
#   dtype           — pandas/numpy dtype name of the value column (e.g. float64)
#   builder         — "module.path:ClassName" import path
#   dependencies    — other feature names and/or "raw:<table>" staged tables
#   as_of_semantics — how as_of is interpreted (free text; enforced by builder)
#   null_policy     — forbid | allow | indicator
#   lookback_window — lookback description (e.g. "season_to_date", "8_games")
#   hypothesis      — REQUIRED non-empty: why this feature should predict
#
# Task 10: efficiency features (DESIGN §4.3–§4.5). Naming:
#   adj_{off|def}_{metric}_{std|ewma|l3d}
# Task 11: tempo + situational (DESIGN §4.5).
# Task 12: roster / prior (DESIGN §4.5).

_builder: &eff_builder ncaa_quant.features.builders.efficiency:EfficiencyFeatureBuilder
_asof: &eff_asof "strict event_time < as_of; season-to-date ridge on eligible games"
_deps: &eff_deps
  - raw:plays
  - raw:games
  - raw:teams
  - raw:drives

_tempo_builder: &tempo_builder ncaa_quant.features.builders.tempo:TempoFeatureBuilder
_tempo_asof: &tempo_asof "strict event_time < as_of; season-to-date tempo on eligible games"
_tempo_deps: &tempo_deps
  - raw:plays
  - raw:games
  - raw:teams

_sit_builder: &sit_builder ncaa_quant.features.builders.situational:SituationalFeatureBuilder
_sit_asof: &sit_asof "strict event_time < as_of; schedule features knowable after prior kickoffs"
_sit_deps: &sit_deps
  - raw:games
  - raw:venues
  - raw:teams

_roster_builder: &roster_builder ncaa_quant.features.builders.roster:RosterFeatureBuilder
_roster_asof: &roster_asof "strict event_time < as_of; preseason Aug-1 priors and manual QB status"
_roster_deps: &roster_deps
  - raw:teams
  - raw:returning_production
  - raw:talent
  - raw:recruiting
  - raw:portal
  - raw:coaches
  - raw:qb_status

features:
  # --- EPA / play (overall + rush/pass) ---
  - name: adj_off_epa_std
    version: "1"
    dtype: float64
    builder: *eff_builder
    dependencies: *eff_deps
    as_of_semantics: *eff_asof
    null_policy: allow
    lookback_window: season_to_date
    hypothesis: >-
      Opponent-adjusted offensive EPA/play (season-to-date, shrunk) measures
      true scoring efficiency independent of schedule strength and predicts
      future margins better than raw EPA.

  - name: adj_off_epa_ewma
    version: "1"
    dtype: float64
    builder: *eff_builder
    dependencies: *eff_deps
    as_of_semantics: *eff_asof
    null_policy: allow
    lookback_window: ewma_efficiency_half_life
    hypothesis: >-
      EWMA of game-level adjusted off EPA tracks within-season form shifts
      (coordinator changes, injuries) that a flat season mean smooths away.

  - name: adj_off_epa_l3d
    version: "1"
    dtype: float64
    builder: *eff_builder
    dependencies: *eff_deps
    as_of_semantics: *eff_asof
    null_policy: allow
    lookback_window: last_3_games_delta
    hypothesis: >-
      Last-3 minus season adjusted off EPA is a small recent-form residual the
      trees can use when short-term momentum differs from season level.

  - name: adj_def_epa_std
    version: "1"
    dtype: float64
    builder: *eff_builder
    dependencies: *eff_deps
    as_of_semantics: *eff_asof
    null_policy: allow
    lookback_window: season_to_date
    hypothesis: >-
      Opponent-adjusted defensive EPA suppression (season-to-date, shrunk)
      measures schedule-neutral run/pass defense quality that predicts future
      points allowed.

  - name: adj_def_epa_ewma
