name: site

on:
  push:
    paths:
      - "webapp/site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "webapp/site/**"
      - ".github/workflows/site.yml"

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/site
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/site/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test
        run: npm run test

      - name: published-copy union grep
        run: npm run check:copy

      - name: build
        run: npm run build
        env:
          ARTIFACT_SOURCE: fixtures
